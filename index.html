<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Chat Archive</title>
<style>
:root{--bg:#313338;--bg2:#2b2d31;--bg3:#1e1f22;--hover:#2e3035;--text:#dbdee1;--muted:#949ba4;--head:#f2f3f5;--blurple:#5865f2;--link:#00a8fc;--line:#3f4147}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:16px/1.375 "gg sans","Noto Sans","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
::-webkit-scrollbar{width:14px;height:14px}::-webkit-scrollbar-thumb{background:#1a1b1e;border:3px solid var(--bg);border-radius:8px}::-webkit-scrollbar-track{background:#2b2d31}
#app{display:flex;height:100%;overflow:hidden}

/* sidebar */
#side{width:260px;flex:none;background:var(--bg2);display:flex;flex-direction:column;border-right:1px solid var(--bg3);z-index:5}
.side-h{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;font-weight:600;color:var(--head);box-shadow:0 1px 0 rgba(0,0,0,.25)}
#chlist{padding:8px;overflow:auto;flex:1}
.ch{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:4px;cursor:pointer;color:var(--muted)}
.ch:hover{background:var(--hover);color:var(--text)}.ch.on{background:#404249;color:var(--head)}
.ch img{width:32px;height:32px;border-radius:50%;flex:none}
.ch span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stats{padding:12px 16px;font-size:.8125rem;color:var(--muted);border-top:1px solid var(--bg3);max-height:45%;overflow:auto;line-height:1.6}
#stats b{color:var(--text)}
#stats .rowc{display:flex;justify-content:space-between;gap:8px}

/* center */
#center{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
#top{height:48px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:0 1px 0 rgba(0,0,0,.25);z-index:3;background:var(--bg)}
#menu{display:none;background:none;border:0;font-size:1.25rem;cursor:pointer;color:var(--muted);padding:0}
#title{font-weight:600;color:var(--head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#title i{color:var(--muted);font-style:normal;margin-right:6px;font-weight:400}
.grow{flex:1}
.jump{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.8125rem;white-space:nowrap}
#jump{background:var(--bg3);border:0;border-radius:4px;padding:4px 6px;color-scheme:dark}
#searchwrap{position:relative;width:240px;flex:none;transition:width .2s}
#searchwrap:focus-within{width:340px}
#q{width:100%;background:var(--bg3);border:0;border-radius:4px;padding:6px 28px 6px 8px;outline:none}
#qclear{position:absolute;right:4px;top:3px;background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;line-height:1;padding:2px 4px;display:none}
#sugg{position:absolute;top:38px;right:0;width:340px;background:var(--bg3);border-radius:6px;box-shadow:0 8px 16px rgba(0,0,0,.45);padding:8px;display:none;max-height:65vh;overflow:auto}
#sugg h4{margin:8px 8px 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.02em;color:var(--muted)}
#sugg h4:first-child{margin-top:2px}
#sugg .it{padding:6px 8px;border-radius:4px;cursor:pointer;font-size:.875rem;display:flex;gap:6px}
#sugg .it:hover{background:#35373c}
#sugg .it b{color:var(--head);font-weight:600}#sugg .it span{color:var(--muted)}

/* chat */
#chat{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;overflow-anchor:none}
#msgs{padding-bottom:24px}
.start{padding:48px 16px 8px 16px}
.start h1{margin:0 0 8px;font-size:2rem;color:var(--head)}
.start p{margin:0;color:var(--muted)}
.divider{display:flex;align-items:center;margin:24px 16px 0 16px;color:var(--muted);font-size:.75rem;font-weight:600;line-height:0;border-top:1px solid #3f4147;height:0;justify-content:center}
.divider span{background:var(--bg);padding:0 8px;line-height:1}
.msg{position:relative;padding:2px 48px 2px 72px;margin-top:17px;min-height:1.375rem}
.msg.grp{margin-top:0}
.divider+.msg{margin-top:17px}
.msg:hover{background:var(--hover)}
.msg.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,55%{background:rgba(250,166,26,.22)}100%{background:transparent}}
.avatar{position:absolute;left:16px;top:4px;width:40px;height:40px;border-radius:50%;background:#1e1f22;object-fit:cover}
.msg.hasreply .avatar{top:24px}
.gtime{position:absolute;left:0;width:72px;text-align:center;font-size:.6875rem;color:var(--muted);visibility:hidden;line-height:1.375rem;user-select:none}
.msg:hover .gtime{visibility:visible}
.mh{line-height:1.375rem;display:flex;align-items:baseline;gap:8px}
.an{font-weight:500;color:var(--head)}
.mh time{font-size:.75rem;color:var(--muted);font-weight:400}
.pin{font-size:.75rem;color:var(--muted)}
.mc{overflow-wrap:anywhere;word-break:break-word}
.mc .edited{font-size:.625rem;color:var(--muted);margin-left:4px;user-select:none}
.mc code{background:#2b2d31;border:1px solid #1e1f22;border-radius:4px;padding:0 4px;font:.875rem/1.125rem Consolas,"Andale Mono WT","Andale Mono","Lucida Console",monospace}
.mc pre{margin:6px 0 0;background:#2b2d31;border:1px solid #1e1f22;border-radius:4px;padding:7px 10px;max-width:90%;overflow:auto}
.mc pre code{background:none;border:0;padding:0;white-space:pre}
.mc blockquote{margin:2px 0;padding:0 8px 0 12px;border-left:4px solid #4e5058;border-radius:2px}
.mc .h{font-weight:700;margin:8px 0 4px}.mc .h1{font-size:1.5rem}.mc .h2{font-size:1.25rem}.mc .h3{font-size:1rem}
.mc .spoiler{background:#1e1f22;color:transparent;border-radius:3px;cursor:pointer;user-select:none}
.mc .spoiler.open{background:#41434a;color:inherit;cursor:auto;user-select:auto}
.mention{background:rgba(88,101,242,.3);color:#c9cdfb;border-radius:3px;padding:0 2px;font-weight:500}
.emoji{width:1.375em;height:1.375em;vertical-align:bottom;object-fit:contain}
.jumbo{font-size:2.75rem;line-height:1.25}.jumbo .emoji{width:3rem;height:3rem}
.reply{display:flex;align-items:center;gap:6px;font-size:.875rem;color:var(--muted);position:relative;height:1.25rem;margin-bottom:2px;cursor:pointer;white-space:nowrap}
.reply:before{content:"";position:absolute;left:-36px;top:50%;width:33px;height:10px;border-left:2px solid #4e5058;border-top:2px solid #4e5058;border-top-left-radius:6px;pointer-events:none}
.reply img{width:16px;height:16px;border-radius:50%}
.reply .rn{font-weight:500;opacity:.9}
.reply .rt{overflow:hidden;text-overflow:ellipsis;min-width:0}
.reply:hover .rt{color:var(--text)}
.media{display:block;max-width:min(400px,100%);max-height:350px;border-radius:8px;margin-top:6px;cursor:zoom-in;background:#2b2d31}
video.media,audio{cursor:auto}audio{display:block;margin-top:6px;max-width:100%}
.broken{margin-top:6px;padding:10px 12px;border-radius:8px;background:#2b2d31;border:1px dashed #4e5058;color:var(--muted);font-size:.8125rem;max-width:400px}
.file{display:flex;align-items:center;gap:10px;margin-top:6px;padding:10px 12px;background:#2b2d31;border:1px solid #1e1f22;border-radius:8px;max-width:400px}
.file .fi{font-size:1.6rem}.file small{color:var(--muted);display:block}
.file a{font-weight:500;overflow-wrap:anywhere}
.embed{display:block;max-width:432px;margin-top:8px;background:#2b2d31;border-left:4px solid var(--c,#1e1f22);border-radius:4px;padding:8px 16px 16px 12px;font-size:.875rem}
.embed .ea{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.embed .ea img{width:24px;height:24px;border-radius:50%}
.embed .et{margin-top:8px;font-weight:600;font-size:1rem;color:var(--head)}
.embed .ed{margin-top:8px;color:#dbdee1;overflow-wrap:anywhere}
.embed .ef{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.embed .ef .full{grid-column:1/-1}.embed .ef b{display:block;color:var(--head)}
.embed img.ei{max-width:100%;max-height:300px;border-radius:4px;margin-top:16px;display:block;cursor:zoom-in}
.embed .ft{margin-top:8px;font-size:.75rem;color:var(--muted)}
.sticker{width:160px;height:160px;margin-top:6px;object-fit:contain;display:block}
.rx{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rx div{display:flex;align-items:center;gap:6px;background:#2b2d31;border:1px solid transparent;border-radius:8px;padding:2px 6px;font-size:.875rem;color:#b5bac1}
.rx img{width:16px;height:16px}
.msg.sys{margin-top:8px;display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.9375rem;padding-left:24px}
.msg.sys .sysicon{width:32px;text-align:center;font-size:1.1rem;flex:none}
.msg.sys b{color:var(--head);font-weight:500}.msg.sys time{font-size:.75rem;margin-left:6px}
#toPresent{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);background:var(--blurple);color:#fff;border:0;border-radius:16px;padding:6px 16px;font-size:.875rem;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);display:none;z-index:2}

/* results */
#results{width:420px;flex:none;background:var(--bg2);border-left:1px solid var(--bg3);display:flex;flex-direction:column;z-index:4}
#results[hidden]{display:none}
.rhead{height:48px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;box-shadow:0 1px 0 rgba(0,0,0,.25)}
.rhead b{color:var(--head);flex:1}
.rhead select{background:var(--bg3);border:0;border-radius:4px;padding:4px 6px;color-scheme:dark}
.rhead button{background:none;border:0;color:var(--muted);font-size:1.3rem;cursor:pointer;line-height:1}
#rlist{flex:1;overflow:auto;padding:8px}
.res{background:var(--bg);border:1px solid #1e1f22;border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer}
.res:hover{border-color:#4e5058}
.res .rh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.res .rh img{width:24px;height:24px;border-radius:50%}
.res .rh b{color:var(--head);font-weight:500}.res .rh time{font-size:.75rem;color:var(--muted);margin-left:auto}
.res .rb{font-size:.9375rem;overflow-wrap:anywhere}
.res mark{background:rgba(250,166,26,.35);color:var(--head);border-radius:2px;padding:0 1px}
.res .rm{color:var(--muted);font-size:.8125rem;margin-top:2px}
.none,.more{text-align:center;color:var(--muted);padding:24px 12px}
.more button{background:var(--blurple);border:0;color:#fff;border-radius:4px;padding:6px 16px;cursor:pointer}

#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
#lightbox img{max-width:92vw;max-height:92vh;border-radius:4px}
#drop{position:fixed;inset:0;background:var(--bg);z-index:40;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#drop .box{max-width:460px;border:2px dashed #4e5058;border-radius:12px;padding:36px 28px}
#drop h2{margin:0 0 8px;color:var(--head)}#drop p{color:var(--muted);margin:8px 0}
#drop label{display:inline-block;margin-top:12px;background:var(--blurple);color:#fff;border-radius:4px;padding:8px 18px;cursor:pointer}
#drop.over .box{border-color:var(--blurple);background:rgba(88,101,242,.08)}
#lock{position:fixed;inset:0;background:var(--bg);z-index:45;display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock .box{width:min(380px,100%);background:var(--bg2);border-radius:8px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#lock h2{margin:0 0 6px;color:var(--head)}#lock p{color:var(--muted);margin:6px 0 16px}
#lock input{width:100%;background:var(--bg3);border:0;border-radius:4px;padding:10px;outline:none;margin-bottom:12px}
#lock button{width:100%;background:var(--blurple);color:#fff;border:0;border-radius:4px;padding:10px;cursor:pointer;font-weight:600}
#lock button:disabled{opacity:.6;cursor:wait}
#lock .err{color:#f23f42;min-height:1.4em;margin:12px 0 0}

@media (max-width:900px){
  #side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .2s}
  body.nav #side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #menu{display:block}
  #results{position:fixed;inset:0;width:auto;border:0}
  .jump span{display:none}
  #searchwrap,#searchwrap:focus-within{width:min(200px,45vw)}
  #searchwrap:focus-within{width:min(260px,60vw)}
  #sugg{width:min(340px,92vw)}
  .msg{padding-right:12px;padding-left:64px}
  .avatar{left:12px}
}
</style>
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="side-h">Chat Archive</div>
    <div id="chlist"></div>
    <div id="stats"></div>
  </nav>
  <section id="center">
    <header id="top">
      <button id="menu" aria-label="Chats">☰</button>
      <div id="title"></div>
      <div class="grow"></div>
      <label class="jump" title="Jump to a date"><span>Jump to</span><input type="date" id="jump"></label>
      <div id="searchwrap">
        <input id="q" placeholder="Search" autocomplete="off" spellcheck="false">
        <button id="qclear" aria-label="Clear search">×</button>
        <div id="sugg"></div>
      </div>
    </header>
    <div id="chat"><div id="msgs"></div></div>
    <button id="toPresent">Jump to present ↓</button>
  </section>
  <aside id="results" hidden>
    <div class="rhead">
      <b id="rcount"></b>
      <select id="order" aria-label="Sort results"><option value="desc">Newest</option><option value="asc">Oldest</option></select>
      <button id="rclose" aria-label="Close results">×</button>
    </div>
    <div id="rlist"></div>
  </aside>
</div>
<div id="lightbox"><img alt=""></div>
<div id="lock">
  <form class="box" id="lockform">
    <h2>🔒 This chat is locked</h2>
    <p>Enter the password to unlock it.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" spellcheck="false">
    <button id="unlockBtn" type="submit">Unlock</button>
    <p class="err" id="lockerr"></p>
  </form>
</div>
<div id="drop">
  <div class="box">
    <h2>Load your chat export</h2>
    <p id="dropmsg">Drop your exported <b>.json</b> or locked <b>.enc</b> file(s) here.</p>
    <label>Choose file(s)<input id="file" type="file" accept=".json,.enc,application/json" multiple hidden></label>
  </div>
</div>
<noscript>This viewer needs JavaScript.</noscript>

<script>
(() => {
'use strict';

/* ---------- config ---------- */
// Files to load, in the same folder as this page. chat.enc is the password-locked
// version made with encrypt.html; chat.json is the plain export. Missing ones are skipped.
// Several files are fine (different chats, or one chat split into parts, same password).
const FILES = ['chat.enc', 'chat.json'];
const PAGE = 150, MAXW = 700, DAY = 86400000;

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const fmtTime = d => d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fmtDay = d => d.toLocaleDateString([], {year:'numeric',month:'long',day:'numeric'});
const fmtFull = d => d.toLocaleString([], {dateStyle:'full',timeStyle:'short'});
const fmtShort = d => d.toLocaleDateString([], {year:'numeric',month:'2-digit',day:'2-digit'}) + ' ' + fmtTime(d);
const dayKey = t => { const d = new Date(t); return d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate(); };
const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const IMG = /\.(png|jpe?g|gif|webp|bmp|avif|svg)(\?|$)/i, VID = /\.(mp4|webm|mov|m4v|mkv)(\?|$)/i, AUD = /\.(mp3|ogg|wav|m4a|flac|opus|aac)(\?|$)/i;
const HAS = {image:1,video:2,sound:4,file:8,attachment:16,link:32,embed:64,sticker:128,reaction:256};
const HAS_ALIAS = {images:'image',photo:'image',photos:'image',videos:'video',audio:'sound',files:'file',attachments:'attachment',links:'link',url:'link',embeds:'embed',stickers:'sticker',reactions:'reaction'};
function avatarFallback(name, id) {
  let h = 0; const s = String(id || name || '?');
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  const ch = esc((name || '?').trim().charAt(0).toUpperCase() || '?');
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(${h % 360},45%,40%)"/><text x="40" y="53" font-size="38" font-family="Arial,sans-serif" fill="#fff" text-anchor="middle">${ch}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
const avatarOf = (a) => a.avatarUrl || avatarFallback(a.nickname || a.name, a.id);

/* ---------- data ---------- */
const channels = new Map();
let cur = null;

function addExport(data) {
  if (!data || !Array.isArray(data.messages)) throw new Error('Not a DiscordChatExporter JSON file (no "messages" array).');
  const cid = (data.channel && data.channel.id) || 'chat';
  let ch = channels.get(cid);
  if (!ch) { ch = {id: cid, raw: data.channel || {}, guild: data.guild || {}, messages: []}; channels.set(cid, ch); }
  for (const m of data.messages) ch.messages.push(m);
}

function finalize(ch) {
  const seen = new Set(), ms = [];
  for (const m of ch.messages) {
    if (!m || seen.has(m.id)) continue;
    seen.add(m.id);
    m._t = Date.parse(m.timestamp);
    if (isNaN(m._t)) m._t = 0;
    m.author = m.author || {id: '0', name: 'Unknown'};
    ms.push(m);
  }
  ms.sort((a, b) => a._t - b._t);
  ch.messages = ms;
  ch.byId = new Map();
  ch.authors = new Map();
  const counts = new Map();
  ms.forEach((m, i) => {
    ch.byId.set(m.id, i);
    ch.authors.set(m.author.id, m.author);
    counts.set(m.author.id, (counts.get(m.author.id) || 0) + 1);
    m._name = m.author.nickname || m.author.name || 'Unknown';
    m._nm = ((m.author.nickname || '') + ' ' + (m.author.name || '')).toLowerCase();
    let h = 0, parts = [m.content || ''];
    for (const a of m.attachments || []) {
      const f = a.fileName || a.url || '';
      parts.push(f);
      h |= HAS.attachment;
      if (IMG.test(f)) h |= HAS.image; else if (VID.test(f)) h |= HAS.video; else if (AUD.test(f)) h |= HAS.sound; else h |= HAS.file;
    }
    for (const e of m.embeds || []) {
      h |= HAS.embed;
      parts.push(e.title, e.description, e.url, e.author && e.author.name, e.footer && e.footer.text);
      for (const f of e.fields || []) parts.push(f.name, f.value);
      if ((e.images && e.images.length) || e.thumbnail) h |= HAS.image;
    }
    if ((m.stickers || []).length) { h |= HAS.sticker; for (const s of m.stickers) parts.push(s.name); }
    if ((m.reactions || []).length) h |= HAS.reaction;
    if (/https?:\/\//i.test(m.content || '') || (m.embeds || []).some(e => e.url)) h |= HAS.link;
    m._h = h;
    m._text = parts.filter(Boolean).join('\n').toLowerCase();
  });
  const people = [...counts.entries()].filter(([id]) => !(ch.authors.get(id).isBot)).sort((a, b) => b[1] - a[1]).map(([id]) => ch.authors.get(id));
  ch.people = people;
  const dm = ch.guild.name === 'Direct Messages' || /^Direct/i.test(ch.raw.type || '');
  ch.dm = dm;
  ch.title = dm
    ? (people.map(p => p.nickname || p.name).join(' & ') || ch.raw.name || 'Direct Messages')
    : (ch.raw.name || 'chat');
  ch.counts = counts;
  ch.s = ch.e = 0;
}

/* ---------- markdown ---------- */
function nameFor(id, m) {
  const u = ((m && m.mentions) || []).find(x => x.id === id);
  if (u) return u.nickname || u.name;
  const a = cur && cur.authors.get(id);
  return a ? (a.nickname || a.name) : 'unknown';
}
const JUMBO = /^(?:\s|\p{Extended_Pictographic}|\p{Emoji_Modifier}|\uFE0F|\u200D|<a?:\w+:\d+>)+$/u;
function md(text, m) {
  const store = [];
  const stash = h => { store.push(h); return '\u0000' + (store.length - 1) + '\u0000'; };
  let t = String(text || '');
  t = t.replace(/```(?:[\w+#-]*\n)?([\s\S]*?)```/g, (_, c) => stash('<pre><code>' + esc(c.replace(/\n$/, '')) + '</code></pre>'));
  t = t.replace(/`([^`\n]+)`/g, (_, c) => stash('<code>' + esc(c) + '</code>'));
  t = esc(t);

}
async function loadFiles(files) {
  try {
    const enc = [];
    for (const f of files) {
      const u8 = new Uint8Array(await f.arrayBuffer());
      if (isEnc(u8)) enc.push(u8); else addExport(decodeJSON(u8));
    }
    if (enc.length) askPassword(enc); else start();
  } catch (err) { showDrop('<span style="color:#f23f42">Could not read that file:</span> ' + esc(err.message)); }
}
function start() {
  if (!channels.size) return;
  for (const ch of channels.values()) finalize(ch);
  $('#drop').style.display = 'none';
  openChannel(cur && channels.has(cur.id) ? cur.id : [...channels.keys()][0]);
}
async function init() {
  const enc = []; let loaded = 0;
  for (const f of FILES) {
    try {
      const r = await fetch(f, {cache: 'no-cache'});
      if (!r.ok) throw new Error(r.status + ' ' + f);
      const u8 = new Uint8Array(await r.arrayBuffer());
      if (isEnc(u8)) enc.push(u8); else { addExport(decodeJSON(u8)); loaded++; }
    } catch (err) { /* missing or not a chat file: try the next one */ }
  }
  if (!enc.length && !loaded) {
    // Hosted from a private bucket: the server lists the .json exports at its top level.
    try {
      const lr = await fetch('__list', {cache: 'no-cache'});
      const names = lr.ok ? await lr.json() : [];
      if (Array.isArray(names)) for (const name of names) {
        try {
          const r = await fetch(encodeURIComponent(name), {cache: 'no-cache'});
          if (r.ok) { addExport(decodeJSON(new Uint8Array(await r.arrayBuffer()))); loaded++; }
        } catch (err) { /* skip files that aren't chat exports */ }
      }
    } catch (err) { /* no listing available (not on the Worker) */ }
  }
  if (enc.length) askPassword(enc);
  else if (loaded) start();
  else showDrop(location.protocol === 'file:'
    ? 'Opened straight from disk, so the browser can\'t auto-load <b>' + esc(FILES[0]) + '</b>.<br>Drop your exported <b>.json</b> or locked <b>.enc</b> file here instead.'
    : 'Couldn\'t find <b>' + esc(FILES[0]) + '</b> next to this page.<br>Drop your exported <b>.json</b> or locked <b>.enc</b> file here.');
}

/* ---------- events ---------- */
let rafBusy = false;
chatEl().addEventListener('scroll', () => { if (rafBusy) return; rafBusy = true; requestAnimationFrame(() => { rafBusy = false; onScroll(); }); }, {passive: true});
['wheel', 'touchstart', 'mousedown', 'keydown'].forEach(ev => chatEl().addEventListener(ev, () => { pin = null; }, {passive: true}));
boxEl().addEventListener('load', applyPin, true);

document.addEventListener('error', e => {
  const t = e.target;
  if (!(t instanceof HTMLImageElement)) return;
  if (t.classList.contains('avatar') || t.classList.contains('avatar-s')) { if (!t.dataset.fb) { t.dataset.fb = 1; t.src = avatarFallback(t.alt); } }
  else if (t.classList.contains('media') || t.classList.contains('media-e') || t.classList.contains('sticker')) {
    const d = document.createElement('div'); d.className = 'broken';
    d.textContent = '⚠ Image unavailable — the Discord link has probably expired. Re-export with media downloaded to keep images permanently.';
    t.replaceWith(d);
  } else if (t.classList.contains('emoji')) t.replaceWith(document.createTextNode(t.alt || ''));
}, true);

boxEl().addEventListener('click', e => {
  const t = e.target;
  const sp = t.closest('.spoiler'); if (sp) { sp.classList.add('open'); return; }
  const rp = t.closest('.reply[data-ref]'); if (rp) { jumpTo(+rp.dataset.ref); return; }
  if (t.tagName === 'IMG' && (t.classList.contains('media') || t.classList.contains('media-e'))) {
    $('#lightbox img').src = t.src; $('#lightbox').style.display = 'flex';
  }
});
$('#lightbox').addEventListener('click', () => { $('#lightbox').style.display = 'none'; });
$('#toPresent').addEventListener('click', jumpPresent);
$('#chlist').addEventListener('click', e => { const c = e.target.closest('.ch'); if (c) openChannel(c.dataset.id); });
$('#menu').addEventListener('click', () => document.body.classList.toggle('nav'));
$('#center').addEventListener('click', () => document.body.classList.remove('nav'));

$('#jump').addEventListener('change', e => {
  const t = parseDate(e.target.value); if (t == null || !cur) return;
  const ms = cur.messages; let lo = 0, hi = ms.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (ms[mid]._t < t) lo = mid + 1; else hi = mid; }
  jumpTo(Math.min(lo, ms.length - 1), true);
});

const q = $('#q'); let qTimer = 0;
q.addEventListener('input', () => {
  $('#qclear').style.display = q.value ? 'block' : 'none';
  if (q.value.trim()) hideSugg(); else { showSugg(); closeResults(); }
  clearTimeout(qTimer); qTimer = setTimeout(runSearch, 300);
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(qTimer); hideSugg(); runSearch(); }
  if (e.key === 'Escape') { hideSugg(); q.blur(); }
});
q.addEventListener('focus', showSugg);
q.addEventListener('blur', () => setTimeout(hideSugg, 150));
$('#sugg').addEventListener('mousedown', e => {
  const it = e.target.closest('.it'); if (!it) return;
  e.preventDefault();
  q.value = (q.value ? q.value.replace(/\s*$/, ' ') : '') + it.dataset.ins;
  q.focus(); hideSugg();
  $('#qclear').style.display = 'block';
  if (/\s$/.test(q.value)) runSearch();
});
$('#qclear').addEventListener('click', () => { q.value = ''; $('#qclear').style.display = 'none'; closeResults(); q.focus(); });
$('#order').addEventListener('change', () => { res.shown = 0; $('#rlist').innerHTML = ''; renderResults(); });
$('#rclose').addEventListener('click', closeResults);
$('#rlist').addEventListener('click', e => {
  if (e.target.id === 'moreBtn') { renderResults(); return; }
  const r = e.target.closest('.res'); if (!r) return;
  if (matchMedia('(max-width:900px)').matches) closeResults();
  jumpTo(+r.dataset.idx);
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); q.focus(); }
  else if (e.key === '/' && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
  else if (e.key === 'Escape') { $('#lightbox').style.display = 'none'; if (document.activeElement === document.body) closeResults(); }
});

/* drag & drop / file picker */
$('#lockform').addEventListener('submit', e => { e.preventDefault(); unlock(); });
$('#file').addEventListener('change', e => loadFiles([...e.target.files]));
window.addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
window.addEventListener('dragleave', e => { if (!e.relatedTarget) $('#drop').classList.remove('over'); });
window.addEventListener('drop', e => { e.preventDefault(); $('#drop').classList.remove('over'); const fs = [...e.dataTransfer.files].filter(f => /\.(json|enc)$/i.test(f.name)); if (fs.length) loadFiles(fs); });

init();
})();
</script>
</body>
</html>
